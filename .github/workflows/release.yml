name: Publish Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.14.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check version and release notes
        run: python3 scripts/package_apk.py --tag "$RELEASE_TAG" --check-version
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check app
        run: bash ./gradlew testDebugUnitTest lintRelease --console=plain
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['ANDROID_KEYSTORE_BASE64']
          if not value:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 secret is missing')
          Path(os.environ['RUNNER_TEMP'], 'tinyglyph-release.p12').write_bytes(base64.b64decode(value, validate=True))
          PY
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tinyglyph-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --console=plain
      - name: Verify and name APK
        run: python3 scripts/package_apk.py --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release.apk --output release
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "tinyGlyph $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
            gh release upload "$RELEASE_TAG" release/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" release/*.apk --verify-tag --title "tinyGlyph $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tinyglyph-release.p12"
